services:
  postgres:
    image: postgres:17-alpine
    container_name: heatshield-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: heatshield
      POSTGRES_USER: heatshield
      POSTGRES_PASSWORD: heatshield
    ports:
      - "5432:5432"
    volumes:
      - heatshield_pgdata:/var/lib/postgresql/data

volumes:
  heatshield_pgdata:
