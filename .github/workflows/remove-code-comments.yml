name: Remove code comments

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  remove-comments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove comments
        shell: python
        run: |
          from pathlib import Path
          import io
          import re
          import tokenize

          root = Path('.')

          def strip_python(text):
              lines = text.splitlines(True)
              spans = {}
              for token in tokenize.generate_tokens(io.StringIO(text).readline):
                  if token.type == tokenize.COMMENT:
                      spans.setdefault(token.start[0], []).append(token.start[1])
              result = []
              for number, line in enumerate(lines, 1):
                  if number in spans:
                      line = line[:spans[number][0]] + ('\n' if line.endswith('\n') else '')
                  result.append(line)
              return ''.join(result)

          def strip_cstyle(text):
              out = []
              i = 0
              n = len(text)
              state = 'code'
              quote = ''
              while i < n:
                  c = text[i]
                  d = text[i + 1] if i + 1 < n else ''
                  if state == 'code':
                      if c in ('"', "'"):
                          quote = c
                          state = 'string'
                          out.append(c)
                          i += 1
                          continue
                      if c == '`':
                          state = 'template'
                          out.append(c)
                          i += 1
                          continue
                      if c == '/' and d == '*':
                          i += 2
                          while i < n and not (text[i] == '*' and i + 1 < n and text[i + 1] == '/'):
                              i += 1
                          i = min(n, i + 2)
                          continue
                      if c == '/' and d == '/':
                          prev = out[-1] if out else '\n'
                          if prev.isspace() or prev in ';{}':
                              i += 2
                              while i < n and text[i] not in '\r\n':
                                  i += 1
                              continue
                      out.append(c)
                      i += 1
                  elif state == 'string':
                      out.append(c)
                      if c == '\\' and i + 1 < n:
                          out.append(text[i + 1])
                          i += 2
                          continue
                      if c == quote:
                          state = 'code'
                      i += 1
                  else:
                      out.append(c)
                      if c == '\\' and i + 1 < n:
                          out.append(text[i + 1])
                          i += 2
                          continue
                      if c == '`':
                          state = 'code'
                      i += 1
              return ''.join(out)

          def strip_html(text):
              return re.sub(r'<!--[\\s\\S]*?-->', '', text)

          for path in root.rglob('*'):
              if not path.is_file() or any(part in {'.git', 'node_modules', '__pycache__'} for part in path.parts):
                  continue
              if path.suffix not in {'.py', '.js', '.css', '.html'}:
                  continue
              original = path.read_text(encoding='utf-8')
              if path.suffix == '.py':
                  updated = strip_python(original)
              elif path.suffix == '.html':
                  updated = strip_html(original)
              else:
                  updated = strip_cstyle(original)
              if updated != original:
                  path.write_text(updated, encoding='utf-8')

          workflow = Path('.github/workflows/remove-code-comments.yml')
          workflow.unlink(missing_ok=True)

      - name: Commit comment-only cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: remove comments from code files"
          git push
